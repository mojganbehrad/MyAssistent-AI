<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Assistant — Calendar</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #0b1220;
    --surface: #121b2e;
    --border: #253354;
    --text: #e8edf7;
    --text-dim: #8ca0c6;
    --overlay: rgba(11,18,32,0.82);
    --glow: #38bdf8;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #dde3f0;
    --text: #1a2233;
    --text-dim: #5a6b8c;
    --overlay: rgba(244,246,251,0.88);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 20px 14px 50px;
    background-color: var(--bg);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  .wrap { max-width: 400px; margin: 0 auto; }

  /* --- Desktop layout: two columns side by side instead of one long stack --- */
  @media (min-width: 880px) {
    .wrap { max-width: 980px; }
    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 28px;
      align-items: start;
    }
    .col-left, .col-right { min-width: 0; }
  }
  header { margin-bottom: 4px; display: flex; justify-content: space-between; align-items: flex-start; }
  header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 600; }
  header p { margin: 0; color: var(--text-dim); font-size: 12px; }
  .greeting { font-size: 12px; color: var(--glow); margin: 0 0 16px; }

  section { margin-bottom: 18px; }
  section h2 { font-size: 12px; color: var(--text-dim); font-weight: 500; margin: 0 0 8px; }

  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12px;
  }
  .icon-btn:hover { background: var(--border); }

  /* --- Calendar nav --- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav h2 { margin: 0; font-size: 13px; color: var(--text); }
  .today-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    font-size: 11px; padding: 3px 10px; border-radius: 16px; cursor: pointer; margin-bottom: 8px;
  }
  .today-btn:hover { color: var(--text); border-color: var(--text-dim); }

  /* --- Animated gradient border wrapper --- */
  .cal-frame {
    position: relative;
    border-radius: 14px;
    padding: 1.5px;
    background: conic-gradient(from var(--angle, 0deg),
      #38bdf8, #a78bfa, #ec4899, #fb923c, #38bdf8);
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { --angle: 360deg; } }
  @property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    background: var(--surface);
    border-radius: 13px;
    padding: 10px;
  }
  .cal-dow { text-align: center; font-size: 9px; color: var(--text-dim); padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-size: 11px;
    position: relative;
    cursor: default;
  }
  .cal-day.has-event {
    color: #0b1220;
    font-weight: 600;
    box-shadow: 0 0 8px 1px var(--glow, #38bdf8);
  }
  .cal-day.is-today { outline: 1.5px solid var(--text); outline-offset: 1px; }
  .cal-day.empty { visibility: hidden; }

  /* tiny tooltip on hover */
  .cal-day[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 120%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 10px;
    padding: 4px 7px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 5;
    opacity: 0.95;
    pointer-events: none;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 10px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* --- Task list --- */
  .todo {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 10px; margin-bottom: 6px;
  }
  .todo-icon {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .todo-icon svg { width: 14px; height: 14px; color: #0b1220; }
  .todo-text { font-size: 13px; font-weight: 500; }
  .todo-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .delete-btn { background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; padding: 3px 7px; border-radius: 6px; flex-shrink: 0; }
  .delete-btn:hover { color: #f87171; background: var(--border); }
  .empty-state { color: var(--text-dim); font-size: 12px; padding: 8px 0; }

  .task {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 10px; margin-bottom: 6px;
  }
  .task.done .task-title { text-decoration: line-through; color: var(--text-dim); }
  .task input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; accent-color: #3b5bdb; }
  .task-title { font-size: 13px; font-weight: 500; }
  .task-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .badge {
    font-size: 9px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
    text-transform: uppercase; flex-shrink: 0;
  }
  .badge.high { background: rgba(248,113,113,0.15); color: #f87171; }
  .badge.medium { background: rgba(251,146,60,0.15); color: #fb923c; }
  .badge.low { background: rgba(56,189,248,0.15); color: #38bdf8; }

  .dash-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
  .dash-row b { color: var(--text); }
  .progress-bar { background: var(--bg); border-radius: 8px; height: 7px; overflow: hidden; margin: 6px 0; }
  .progress-fill { background: #3b5bdb; height: 100%; transition: width 0.3s; }

  .conflict-banner {
    background: rgba(248,113,113,0.12);
    border: 1px solid #f87171;
    color: #f87171;
    font-size: 11px;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
    display: none;
  }

  /* --- Workspace (tabbed) --- */
  .workspace { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .tab-btn { flex: 1 1 auto; background: none; border: none; color: var(--text-dim); font-size: 11px; padding: 9px 4px; cursor: pointer; white-space: nowrap; }
  .tab-btn.active { color: var(--text); background: var(--bg); font-weight: 600; }
  .tab-panel { display: none; padding: 14px; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 9px; }

  .form input, .form select, .form textarea,
  .tab-panel input, .tab-panel select, .tab-panel textarea {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: inherit; width: 100%;
  }
  .time-row { display: flex; gap: 8px; }
  .color-row { display: flex; gap: 6px; }
  .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .color-dot.selected { border-color: var(--text); }

  button.primary { background: #3b5bdb; color: white; border: none; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 500; cursor: pointer; }
  button.primary:hover { opacity: 0.9; }
  button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px; font-size: 12px; cursor: pointer; }

  .report-box { font-size: 12px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }

  /* --- Command bar (Ctrl+K) --- */
  .cmd-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    align-items: flex-start; justify-content: center; padding-top: 14vh; z-index: 50;
  }
  .cmd-overlay.open { display: flex; }
  .cmd-box {
    width: 90%; max-width: 420px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .cmd-box input { font-size: 14px; }
  .cmd-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; }
  .cmd-result { font-size: 12px; color: var(--text); margin-top: 10px; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>My Assistant</h1>
      <p id="monthLabel"></p>
    </div>
    <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>
  </header>
  <p class="greeting" id="greeting"></p>

  <div class="conflict-banner" id="conflictBanner"></div>

  <div class="layout">
  <div class="col-left">

  <section>
    <div class="cal-nav">
      <button id="prevMonth" class="icon-btn">◀</button>
      <h2 id="calTitle"></h2>
      <button id="nextMonth" class="icon-btn">▶</button>
    </div>
    <button id="todayBtn" class="today-btn">Today</button>
    <div class="cal-frame">
      <div class="cal-grid" id="calendar"></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>Tasks</h2>
    <div id="todoList"></div>
  </section>

  </div>
  <div class="col-right">

  <section>
    <h2>Today Dashboard</h2>
    <div class="workspace" style="padding:14px;">
      <div id="dashboardBox" class="empty-state">Loading...</div>
    </div>
  </section>

  <section>
    <h2>Capture (AI: Task or Event)</h2>
    <div class="form">
      <input type="text" id="captureInput" placeholder="e.g. Buy groceries tomorrow / Call Sara at 5pm">
      <button class="primary" id="captureBtn">Capture</button>
      <div class="empty-state" id="captureStatus"></div>
    </div>
  </section>

  <section>
    <h2>Todo list</h2>
    <div id="taskList"></div>
  </section>

  <section>
    <div class="workspace">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="add">Add</button>
        <button class="tab-btn" data-tab="edit">Edit</button>
        <button class="tab-btn" data-tab="ask">Ask</button>
        <button class="tab-btn" data-tab="notes">Notes</button>
        <button class="tab-btn" data-tab="insights">Insights</button>
      </div>

      <div class="tab-panel active" id="panel-add">
        <input type="text" id="quickInput" placeholder="e.g. Coffee with Sara Friday 5-6pm">
        <button class="primary" id="quickBtn">Add with AI</button>
        <div class="empty-state" id="quickStatus"></div>

        <details style="margin-top:4px;">
          <summary style="font-size:11px; color:var(--text-dim); cursor:pointer;">Add manually instead</summary>
          <div style="display:flex; flex-direction:column; gap:9px; margin-top:9px;">
            <input type="text" id="inputText" placeholder="What is it?">
            <input type="date" id="inputDate">
            <div class="time-row">
              <input type="time" id="inputStart" placeholder="Start">
              <input type="time" id="inputEnd" placeholder="End">
            </div>
            <select id="inputCategory">
              <option value="personal">Personal</option>
              <option value="network">Network</option>
            </select>
            <select id="inputIcon">
              <option value="calendar">Calendar</option>
              <option value="coffee">Coffee</option>
              <option value="gift">Birthday / gift</option>
              <option value="shield">Shield (network)</option>
              <option value="lock">Lock (SSL/WAF)</option>
              <option value="video">Meeting</option>
              <option value="landmark">Bank</option>
            </select>
            <select id="inputReminder">
              <option value="1">Remind 1 day before</option>
              <option value="2">Remind 2 days before</option>
              <option value="3">Remind 3 days before</option>
              <option value="7">Remind 1 week before</option>
              <option value="0">No reminder</option>
            </select>
            <div class="color-row" id="colorRow"></div>
            <button class="primary" id="addBtn">Add</button>
          </div>
        </details>
      </div>

      <div class="tab-panel" id="panel-edit">
        <input type="text" id="editInput" placeholder="e.g. Move the bank meeting to Oct 25">
        <button class="primary" id="editBtn">Apply change</button>
        <div class="empty-state" id="editStatus"></div>
      </div>

      <div class="tab-panel" id="panel-ask">
        <input type="text" id="askInput" placeholder="e.g. What do I have today?">
        <button class="primary" id="askBtn">Ask</button>
        <div class="empty-state" id="askAnswer"></div>
      </div>

      <div class="tab-panel" id="panel-notes">
        <div class="empty-state" id="notesMonthLabel" style="margin:0;"></div>
        <textarea id="notesBox" rows="4" placeholder="Anything to remember about this month..."></textarea>
        <button class="primary" id="saveNoteBtn">Save note</button>
        <div class="empty-state" id="noteStatus"></div>
      </div>

      <div class="tab-panel" id="panel-insights">
        <button class="primary" id="reportBtn">Monthly report</button>
        <button class="secondary" id="analyzeBtn">Analyze schedule</button>
        <button class="secondary" id="focusBtn">Suggest focus time</button>
        <div class="report-box" id="reportBox"></div>
      </div>
    </div>
  </section>

  </div>
  </div>

  <p class="cmd-hint" style="text-align:center;">Press <b>Ctrl+K</b> for the command bar</p>
</div>

<!-- Command bar overlay -->
<div class="cmd-overlay" id="cmdOverlay">
  <div class="cmd-box">
    <input type="text" id="cmdInput" placeholder="Type a command… add, edit, ask, search, free time, go to next month">
    <div class="cmd-hint">Press Enter to run · Esc to close</div>
    <div class="cmd-result" id="cmdResult"></div>
  </div>
</div>

<script>
  let items = [];
  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  /* ---- Greeting ---- */
  function setGreeting() {
    const h = new Date().getHours();
    let g = "Good evening";
    if (h < 12) g = "Good morning";
    else if (h < 18) g = "Good afternoon";
    document.getElementById("greeting").textContent = g + "!";
  }

  /* ---- Tabs ---- */
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  /* ---- Conflict banner ---- */
  function showConflicts(conflicts) {
    const banner = document.getElementById("conflictBanner");
    if (!conflicts || conflicts.length === 0) { banner.style.display = "none"; return; }
    banner.textContent = "⚠ Conflicts with: " + conflicts.map(c =>
      `${c.text} (${c.start_time}-${c.end_time})`).join(", ");
    banner.style.display = "block";
  }

  /* ---- Data loading ---- */
  async function loadData() {
    const res = await fetch("/api/items", { cache: "no-store" });
    items = await res.json();
    renderCalendar();
    renderTodos();
  }

  function renderCalendar() {
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";
    const year = viewYear, month = viewMonth;

    const label = new Date(year, month, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
    document.getElementById("monthLabel").textContent = label;
    document.getElementById("calTitle").textContent = label;

    ["S","M","T","W","T","F","S"].forEach(d => {
      const el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = d;
      calendar.appendChild(el);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = new Date().toISOString().slice(0, 10);

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement("div");
      el.className = "cal-day empty";
      calendar.appendChild(el);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const el = document.createElement("div");
      el.className = "cal-day";
      el.textContent = day;
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const dayItems = items.filter(i => i.date === dateStr);

      if (dayItems.length > 0) {
        el.classList.add("has-event");
        el.style.background = dayItems[0].color;
        el.style.setProperty("--glow", dayItems[0].color);
        const tip = dayItems.map(i => `${i.text}${i.start_time ? " · " + i.start_time : ""}`).join(" | ");
        el.setAttribute("data-tip", tip);
      }
      if (dateStr === todayStr) el.classList.add("is-today");

      calendar.appendChild(el);
    }
    renderLegend();
  }

  function renderLegend() {
    const legend = document.getElementById("legend");
    legend.innerHTML = "";
    const seen = new Set();
    items.forEach(i => {
      const key = i.category + i.color;
      if (seen.has(key)) return;
      seen.add(key);
      const span = document.createElement("span");
      span.innerHTML = `<i class="dot" style="background:${i.color}"></i>${i.category}`;
      legend.appendChild(span);
    });
  }

  function renderTodos() {
    const todoList = document.getElementById("todoList");
    todoList.innerHTML = "";
    if (items.length === 0) {
      todoList.innerHTML = `<div class="empty-state">Nothing here yet.</div>`;
      return;
    }
    const sorted = [...items].sort((a, b) => a.date.localeCompare(b.date));
    sorted.forEach(item => {
      const row = document.createElement("div");
      row.className = "todo";
      const timeStr = item.start_time ? ` · ${item.start_time}${item.end_time ? "-" + item.end_time : ""}` : "";
      row.innerHTML = `
        <div class="todo-icon" style="background:${item.color}">
          <i data-lucide="${item.icon}"></i>
        </div>
        <div style="flex:1;">
          <div class="todo-text">${item.text}</div>
          <div class="todo-sub">${item.date}${timeStr} · ${item.category}</div>
        </div>
        <button class="delete-btn" data-id="${item.id}">✕</button>
      `;
      todoList.appendChild(row);
    });
    lucide.createIcons();
    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        await fetch(`/api/items/${btn.dataset.id}`, { method: "DELETE" });
        loadData();
      });
    });
  }

  /* ---- Manual add ---- */
  const palette = ["#38bdf8", "#ec4899", "#a78bfa", "#3b5bdb", "#fb923c", "#f87171"];
  let selectedColor = palette[0];

  function renderColorPicker() {
    const row = document.getElementById("colorRow");
    palette.forEach(color => {
      const dot = document.createElement("div");
      dot.className = "color-dot";
      dot.style.background = color;
      if (color === selectedColor) dot.classList.add("selected");
      dot.addEventListener("click", () => {
        selectedColor = color;
        document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("selected"));
        dot.classList.add("selected");
      });
      row.appendChild(dot);
    });
  }

  async function addNewItem() {
    const text = document.getElementById("inputText").value.trim();
    const dateVal = document.getElementById("inputDate").value;
    const startVal = document.getElementById("inputStart").value || null;
    const endVal = document.getElementById("inputEnd").value || null;
    const category = document.getElementById("inputCategory").value;
    const icon = document.getElementById("inputIcon").value;
    const reminder = parseInt(document.getElementById("inputReminder").value, 10);
    if (!text || !dateVal) { alert("Please fill in both the text and the date."); return; }

    const res = await fetch("/api/items", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text, date: dateVal, category, icon, color: selectedColor,
        start_time: startVal, end_time: endVal, reminder_days: reminder
      })
    });
    const data = await res.json();
    showConflicts(data.conflicts);
    document.getElementById("inputText").value = "";
    document.getElementById("inputDate").value = "";
    loadData();
  }
  document.getElementById("addBtn").addEventListener("click", addNewItem);

  /* ---- Quick add (AI) ---- */
  async function quickAdd() {
    const sentence = document.getElementById("quickInput").value.trim();
    const status = document.getElementById("quickStatus");
    if (!sentence) return;
    status.textContent = "Thinking...";
    const res = await fetch("/api/quick-add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sentence })
    });
    if (!res.ok) { status.textContent = "Something went wrong, try rephrasing."; return; }
    const data = await res.json();
    showConflicts(data.conflicts);
    document.getElementById("quickInput").value = "";
    status.textContent = "";
    loadData();
  }
  document.getElementById("quickBtn").addEventListener("click", quickAdd);

  /* ---- Edit (AI) ---- */
  async function editItem() {
    const instruction = document.getElementById("editInput").value.trim();
    const status = document.getElementById("editStatus");
    if (!instruction) return;
    status.textContent = "Thinking...";
    const res = await fetch("/api/edit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ instruction })
    });
    if (res.status === 404) { status.textContent = "Couldn't find a matching item. Try being more specific."; return; }
    const data = await res.json();
    showConflicts(data.conflicts);
    document.getElementById("editInput").value = "";
    status.textContent = "Updated.";
    loadData();
  }
  document.getElementById("editBtn").addEventListener("click", editItem);

  /* ---- Ask ---- */
  async function askQuestion() {
    const question = document.getElementById("askInput").value.trim();
    const answerBox = document.getElementById("askAnswer");
    if (!question) return;
    answerBox.textContent = "Thinking...";
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    answerBox.textContent = data.answer;
  }
  document.getElementById("askBtn").addEventListener("click", askQuestion);

  /* ---- Notes ---- */
  function monthKey() { return `month:${viewYear}-${String(viewMonth + 1).padStart(2, "0")}`; }
  async function loadNote() {
    const label = new Date(viewYear, viewMonth, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
    document.getElementById("notesMonthLabel").textContent = "Notes for " + label;
    const res = await fetch(`/api/notes/${monthKey()}`, { cache: "no-store" });
    const data = await res.json();
    document.getElementById("notesBox").value = data.text;
    document.getElementById("noteStatus").textContent = "";
  }
  async function saveNote() {
    const text = document.getElementById("notesBox").value;
    await fetch(`/api/notes/${monthKey()}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    document.getElementById("noteStatus").textContent = "Saved.";
  }
  document.getElementById("saveNoteBtn").addEventListener("click", saveNote);

  /* ---- Insights: report / analyze / focus ---- */
  async function generateReport() {
    const box = document.getElementById("reportBox");
    box.textContent = "Generating report...";
    const res = await fetch(`/api/report?year=${viewYear}&month=${viewMonth + 1}`, { cache: "no-store" });
    const data = await res.json();
    const busiest = data.busiest_days.map(([d, c]) => `${d} (${c})`).join(", ") || "—";
    box.textContent =
      `Total events: ${data.total_events}\n` +
      `Total hours: ${data.total_hours}\n` +
      `Busiest days: ${busiest}\n\n` +
      data.summary;
  }
  document.getElementById("reportBtn").addEventListener("click", generateReport);

  async function analyzeSchedule() {
    const box = document.getElementById("reportBox");
    box.textContent = "Analyzing...";
    const res = await fetch(`/api/analyze?year=${viewYear}&month=${viewMonth + 1}`, { cache: "no-store" });
    const data = await res.json();
    const busiest = data.busiest_days.map(([d, c]) => `${d} (${c} events)`).join(", ") || "—";
    const overloaded = data.overloaded_days.map(o => `${o.date} (${o.hours}h)`).join(", ") || "none";
    const byCat = Object.entries(data.by_category).map(([k, v]) => `${k}: ${v}`).join(", ") || "—";
    box.textContent = `Busiest days: ${busiest}\nOverloaded days (5h+): ${overloaded}\nBy category: ${byCat}`;
  }
  document.getElementById("analyzeBtn").addEventListener("click", analyzeSchedule);

  async function suggestFocus() {
    const box = document.getElementById("reportBox");
    box.textContent = "Looking for a free block...";
    const res = await fetch(`/api/focus-suggest`, { cache: "no-store" });
    const data = await res.json();
    box.textContent = data.message;
  }
  document.getElementById("focusBtn").addEventListener("click", suggestFocus);

  /* ---- Month navigation ---- */
  function refreshView() { renderCalendar(); renderTodos(); loadNote(); }
  document.getElementById("prevMonth").addEventListener("click", () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } refreshView();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } refreshView();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    const n = new Date(); viewYear = n.getFullYear(); viewMonth = n.getMonth(); refreshView();
  });

  /* ---- Theme ---- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("themeToggle").textContent = theme === "light" ? "☀️" : "🌙";
    localStorage.setItem("theme", theme);
  }
  applyTheme(localStorage.getItem("theme") || "dark");
  document.getElementById("themeToggle").addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "light" ? "dark" : "light");
  });

  /* ---- Monthly background photo ---- */
  function setMonthlyBackground() {
    const month = new Date().getMonth() + 1;
    const url = `/static/backgrounds/${month}.jpg`;
    document.body.style.backgroundImage = `linear-gradient(var(--overlay), var(--overlay)), url('${url}')`;
  }

  /* ---- Command bar (Ctrl+K) ---- */
  const cmdOverlay = document.getElementById("cmdOverlay");
  const cmdInput = document.getElementById("cmdInput");
  const cmdResult = document.getElementById("cmdResult");

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      cmdOverlay.classList.add("open");
      cmdInput.value = "";
      cmdResult.textContent = "";
      cmdInput.focus();
    }
    if (e.key === "Escape") cmdOverlay.classList.remove("open");
  });
  cmdOverlay.addEventListener("click", (e) => { if (e.target === cmdOverlay) cmdOverlay.classList.remove("open"); });

  cmdInput.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const text = cmdInput.value.trim();
    if (!text) return;
    cmdResult.textContent = "Working...";

    const res = await fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    const data = await res.json();

    if (data.action === "prev_month") { document.getElementById("prevMonth").click(); cmdResult.textContent = "Moved to previous month."; }
    else if (data.action === "next_month") { document.getElementById("nextMonth").click(); cmdResult.textContent = "Moved to next month."; }
    else if (data.action === "today") { document.getElementById("todayBtn").click(); cmdResult.textContent = "Jumped to today."; }
    else if (data.action === "search") {
      cmdResult.textContent = data.results.length
        ? data.results.map(r => `${r.text} — ${r.date}`).join("\n")
        : "No matches found.";
    } else if (data.answer) {
      cmdResult.textContent = data.answer;
    } else if (data.item) {
      cmdResult.textContent = "Done: " + data.item.text;
      showConflicts(data.conflicts);
      loadData();
    } else {
      cmdResult.textContent = "Done.";
      loadData();
    }
  });

  /* ---- Today Dashboard ---- */
  async function loadDashboard() {
    const res = await fetch("/api/today-dashboard", { cache: "no-store" });
    const d = await res.json();
    const box = document.getElementById("dashboardBox");

    if (d.total_today === 0) {
      box.innerHTML = `<div class="empty-state">No tasks due today.</div>`;
      return;
    }

    box.innerHTML = `
      <div class="dash-row"><span>Today's tasks</span><b>${d.done_today}/${d.total_today} done</b></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${d.progress_percent}%"></div></div>
      <div class="dash-row"><span>Top priority</span><b>${d.top_task || "—"}</b></div>
      <div class="dash-row"><span>Free time today</span><b>${d.has_free_time_today ? "Yes" : "Fully booked"}</b></div>
    `;
  }

  /* ---- Tasks (Todo) ---- */
  async function loadTasks() {
    const res = await fetch("/api/tasks", { cache: "no-store" });
    const tasks = await res.json();
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty-state">No tasks yet.</div>`;
      return;
    }

    const sorted = [...tasks].sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const order = { high: 0, medium: 1, low: 2 };
      return (order[a.priority] ?? 1) - (order[b.priority] ?? 1);
    });

    sorted.forEach(t => {
      const row = document.createElement("div");
      row.className = "task" + (t.done ? " done" : "");
      row.innerHTML = `
        <input type="checkbox" ${t.done ? "checked" : ""} data-id="${t.id}">
        <div style="flex:1;">
          <div class="task-title">${t.title}</div>
          <div class="task-sub">${t.due_date ? t.due_date : "no due date"} · ${t.category}</div>
        </div>
        <span class="badge ${t.priority}">${t.priority}</span>
        <button class="delete-btn" data-task-id="${t.id}">✕</button>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", async () => {
        await fetch(`/api/tasks/${cb.dataset.id}/toggle`, { method: "POST" });
        loadTasks();
        loadDashboard();
      });
    });
    list.querySelectorAll(".delete-btn[data-task-id]").forEach(btn => {
      btn.addEventListener("click", async () => {
        await fetch(`/api/tasks/${btn.dataset.taskId}`, { method: "DELETE" });
        loadTasks();
        loadDashboard();
      });
    });
  }

  /* ---- Capture: AI decides Task vs Calendar Event ---- */
  async function captureInput() {
    const sentence = document.getElementById("captureInput").value.trim();
    const status = document.getElementById("captureStatus");
    if (!sentence) return;
    status.textContent = "Thinking...";

    const res = await fetch("/api/capture", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sentence })
    });
    const data = await res.json();

    if (data.kind === "event") {
      status.textContent = `Added to calendar: ${data.item.text}`;
      showConflicts(data.conflicts);
      loadData();
    } else {
      status.textContent = `Added to tasks: ${data.task.title}`;
      loadTasks();
      loadDashboard();
    }
    document.getElementById("captureInput").value = "";
  }
  document.getElementById("captureBtn").addEventListener("click", captureInput);

  /* ---- Init ---- */
  setGreeting();
  renderColorPicker();
  setMonthlyBackground();
  loadData();
  loadNote();
  loadTasks();
  loadDashboard();
</script>

</body>
</html>
